services:
  # Base de Datos (PostgreSQL) - Paso 5 y 8
  db:
    image: postgres:17-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: empresa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - devops-net

  # Administrador de BD (pgAdmin) - Paso 5 y 7
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@correo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - devops-net

  # Aplicación Web (Flask) - Paso 1 y 5
  app:
    build: .
    container_name: flaskapp
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: empresa
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      - db
    networks:
      - devops-net

volumes:
  postgres_data:

networks:
  devops-net:
    driver: bridge