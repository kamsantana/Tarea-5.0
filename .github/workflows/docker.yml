name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: 2.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      # Convierte el nombre del repositorio (Usuario/Repo) a estrictas minúsculas
      - name: Formatear nombre del repositorio
        id: repo_name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir Imagen
        run: |
          docker build \
          -t ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:${{ env.IMAGE_TAG }} \
          -t ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:latest \
          .

      - name: Publicar Imagen
        run: |
          docker push ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:latest